<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Barra Superior -->
    <header class="app-header d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            
            <h1 class="brand-title">Planificador de Tareas</h1>
        </div>

        <div class="header-actions">
            <!-- Selector de Tema Claro / Oscuro -->
            <div class="theme-switch-wrapper">
                <div class="form-check form-switch m-0 d-flex align-items-center gap-2">
                    <input class="form-check-input" type="checkbox" id="themeSwitch" role="switch">
                    <label class="form-check-label" for="themeSwitch">Claro</label>
                </div>
            </div>

            <!-- Botón Cuenta -->
            <a href="#" class="account-link">
                <i class="bi bi-person fs-5"></i>
                <span>Cuenta</span>
            </a>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="container-fluid app-layout">
        <div class="row g-4 h-100">
            <aside class="col-12 col-md-3 col-xl-3 widgets-container">
                <!--clima y ubicación-->
                <div class="widget-card">
                    <div class="weather-top">
                        <i class="bi bi-brightness-high weather-icon"></i>
                        <div class="weather-temp">
                            <div class="weather-degrees">24°</div>
                            <span class="weather-condition">Soleado</span>
                        </div>
                    </div>
                    <div class="weather-details">
                        <div class="weather-item">
                            <i class="bi bi-clock"></i>
                            <span>10:45 AM</span>
                        </div>
                        <div class="weather-item">
                            <i class="bi bi-geo-alt"></i>
                            <span>Medellín</span>
                        </div>
                    </div>
                </div>

                <!--progreso de tareas-->
                <div class="widget-card">
                    <div class="widget-title">
                        <i class="bi bi-bar-chart-fill"></i>
                        <span>Mi progreso</span>
                    </div>
                    <div class="progress-stats">6 de 10 tareas</div>
                    <div class="progress custom-progress" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
                        <div class="progress-bar" style="width: 60%"></div>
                    </div>
                    <p class="progress-pct">60 % completado</p>
                </div>

                <!--próximas tareas-->
                <div class="widget-card">
                    <div class="widget-title">
                        <i class="bi bi-calendar3"></i>
                        <span>Próximas tareas</span>
                    </div>
                    <ul class="next-tasks-list">
                        <li class="next-tasks-item">
                            <i class="bi bi-circle"></i>
                            <span>Estudiar Java</span>
                        </li>
                        <li class="next-tasks-item">
                            <i class="bi bi-circle"></i>
                            <span>Terminar proyecto</span>
                        </li>
                        <li class="next-tasks-item">
                            <i class="bi bi-circle"></i>
                            <span>Revisar pendientes</span>
                        </li>
                    </ul>
                </div>

                <!--consejo del día-->
                <div class="widget-card">
                    <div class="widget-title">
                        <i class="bi bi-lightbulb"></i>
                        <span>Consejo del día</span>
                    </div>
                    <p class="quote-text">“Organiza tu tiempo, alcanza tus metas.”</p>
                </div>

            </aside>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
