<!-- Modal Nueva Tarea -->
<div class="modal fade" id="newTaskModal" tabindex="-1" aria-labelledby="newTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="newTaskModalLabel">Nueva Tarea</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body pt-3">
                <!-- Alerta -->
                <div id="alertError" class="alert alert-danger d-none" role="alert">
                    Por favor, completa todos los campos correctamente.
                </div>
                <form id="newTaskForm">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Nombre</label>
                        <input type="text" class="form-control" id="newTaskNameInput" placeholder="Nombre de la tarea" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-medium">Descripción</label>
                        <textarea class="form-control" id="newTaskDescInput" rows="3" placeholder="Detalles de la tarea..." required></textarea>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label text-secondary small fw-medium">Fecha Límite</label>
                            <input type="date" class="form-control" id="newTaskDateInput" required>
                        </div>

                        <div class="col-6">
                            <label class="form-label text-secondary small fw-medium">Categoría</label>
                            <select class="form-select custom-select" id="newTaskCategoryInput" required>
                                <option value="Urgente" selected>Urgente</option>
                                <option value="Estudio">Estudio</option>
                                <option value="Personal">Personal</option>
                                <option value="Trabajo">Trabajo</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-save-task">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal Eliminar Tarea -->
<div class="modal fade" id="deleteTaskModal" tabindex="-1" aria-labelledby="deleteTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal delete-modal">
            <div class="modal-header border-0 pb-0">
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body pt-3">
                <h2 class="modal-title fs-5 fw-bold" id="deleteTaskModalLabel">Eliminar tarea</h2>
                <p class="delete-modal-copy">La tarea <strong id="deleteTaskName"></strong> se eliminará permanentemente.</p>
                <p class="delete-modal-note">Esta acción no se puede deshacer.</p>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-cancel-delete" data-bs-dismiss="modal">Conservar tarea</button>
                <button type="button" class="btn btn-confirm-delete" id="confirmDeleteTask">
                    Eliminar tarea
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Ver Tarea Completa -->
<div class="modal fade" id="viewTaskModal" tabindex="-1" aria-labelledby="viewTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content custom-modal view-modal">
            <div class="modal-header border-0 pb-0">
                <div class="view-modal-badges">
                    <span class="badge view-modal-badge" id="viewTaskCategory"></span>
                    <span class="badge view-modal-badge" id="viewTaskStatus"></span>
                </div>
                <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body pt-3">
                <h2 class="modal-title fs-4 fw-bold mb-3" id="viewTaskModalLabel"></h2>
                <div class="view-task-meta mb-3">
                    <span><i class="bi bi-calendar3"></i> <strong>Fecha límite:</strong> <span id="viewTaskDate"></span></span>
                    <span><i class="bi bi-person"></i> <strong>Asignado a:</strong> Andres F.</span>
                </div>
                <h6 class="text-secondary small text-uppercase fw-semibold mb-2">Descripción Completa</h6>
                <div class="view-modal-desc-box">
                    <p class="view-modal-desc" id="viewTaskDesc"></p>
                </div>
            </div>
            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-cancel-delete" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
